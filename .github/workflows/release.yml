name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build release artifacts
    if: github.repository == 'alitycs/alitycs-sdk-jvm'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      tag_commit: ${{ steps.verify_tag.outputs.tag_commit }}
      tag_object: ${{ steps.verify_tag.outputs.tag_object }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag targets reviewed main history
        id: verify_tag
        shell: bash
        run: |
          git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/origin/main"
          if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
            echo "error: releases require an annotated tag" >&2
            exit 1
          fi
          tag_object="$(git rev-parse "${GITHUB_REF}^{tag}")"
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if [[ ! "$tag_object" =~ ^[0-9a-f]{40}$ ]] ||
            [[ ! "$tag_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: could not resolve the release tag identity" >&2
            exit 1
          fi
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "error: release tag no longer targets the commit that triggered this run" >&2
            exit 1
          fi
          main_commit="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
            echo "error: release tag must target a commit reachable from main" >&2
            exit 1
          fi
          printf 'tag_commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"
          printf 'tag_object=%s\n' "$tag_object" >> "$GITHUB_OUTPUT"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "11"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify and build release
        run: >-
          ./gradlew --no-daemon clean test koverVerify build
          generatePomFileForMavenJavaPublication
          verifyReleaseVersion -PreleaseTag="${GITHUB_REF_NAME}"
      - name: Prepare release artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp build/libs/*.jar release/
          cp build/publications/mavenJava/pom-default.xml "release/alitycs-sdk-jvm-${version}.pom"
          (cd release && sha256sum *.jar *.pom > SHA256SUMS)
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Attest and publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release
      - name: Recheck immutable release tag
        env:
          EXPECTED_TAG_COMMIT: ${{ needs.build.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
        shell: bash
        run: |
          if [[ ! "$EXPECTED_TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]] ||
            [[ ! "$EXPECTED_TAG_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: build did not provide a valid release tag identity" >&2
            exit 1
          fi
          git fetch --no-tags --force origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
            echo "error: releases require an annotated tag" >&2
            exit 1
          fi
          current_tag_object="$(git rev-parse "${GITHUB_REF}^{tag}")"
          current_tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if [[ "$current_tag_object" != "$EXPECTED_TAG_OBJECT" ]] ||
            [[ "$current_tag_commit" != "$EXPECTED_TAG_COMMIT" ]]; then
            echo "error: release tag changed after the build completed" >&2
            exit 1
          fi
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release/*
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"

  publish-maven-central:
    name: Publish to Maven Central
    if: >-
      github.repository == 'alitycs/alitycs-sdk-jvm' &&
      vars.MAVEN_CENTRAL_PUBLISH_ENABLED == 'true'
    needs: [build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: maven-central
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download attested release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release
      - name: Verify, sign, upload, and validate Central bundle
        shell: bash
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          REQUESTED_PUBLISHING_TYPE: ${{ vars.MAVEN_CENTRAL_PUBLISHING_TYPE }}
          EXPECTED_TAG_COMMIT: ${{ needs.build.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
        run: |
          set -euo pipefail

          : "${CENTRAL_PORTAL_USERNAME:?Missing CENTRAL_PORTAL_USERNAME}"
          : "${CENTRAL_PORTAL_PASSWORD:?Missing CENTRAL_PORTAL_PASSWORD}"
          : "${MAVEN_GPG_PRIVATE_KEY:?Missing MAVEN_GPG_PRIVATE_KEY}"
          : "${MAVEN_GPG_PASSPHRASE:?Missing MAVEN_GPG_PASSPHRASE}"

          publishing_type="${REQUESTED_PUBLISHING_TYPE:-USER_MANAGED}"
          if [[ "$publishing_type" != "USER_MANAGED" && "$publishing_type" != "AUTOMATIC" ]]; then
            echo "error: MAVEN_CENTRAL_PUBLISHING_TYPE must be USER_MANAGED or AUTOMATIC" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          artifact="alitycs-sdk-jvm-${version}"
          required=(
            "release/${artifact}.jar"
            "release/${artifact}-sources.jar"
            "release/${artifact}-javadoc.jar"
            "release/${artifact}.pom"
          )
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "error: required Maven Central artifact is missing: $file" >&2
              exit 1
            fi
          done
          (cd release && sha256sum --check --strict SHA256SUMS)

          bundle_root="central-bundle/com/alitycs/alitycs-sdk-jvm/${version}"
          mkdir -p "$bundle_root"
          cp -- "${required[@]}" "$bundle_root/"

          gpg_home="$(mktemp -d)"
          auth_config="$(mktemp)"
          upload_response="$(mktemp)"
          status_response="$(mktemp)"
          cleanup() {
            rm -rf -- "$gpg_home"
            rm -f -- "$auth_config" "$upload_response" "$status_response"
          }
          trap cleanup EXIT
          chmod 700 "$gpg_home"
          chmod 600 "$auth_config"
          export GNUPGHOME="$gpg_home"
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          signing_fingerprint="$(
            gpg --batch --with-colons --list-secret-keys |
              awk -F: '$1 == "sec" { primary = 1; next } primary && $1 == "fpr" { print $10; exit }'
          )"
          if [[ ! "$signing_fingerprint" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "error: imported key has no primary signing fingerprint" >&2
            exit 1
          fi

          for file in "$bundle_root"/*.jar "$bundle_root"/*.pom; do
            printf '%s' "$MAVEN_GPG_PASSPHRASE" |
              gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --local-user "$signing_fingerprint" --armor --detach-sign "$file"
            md5sum "$file" | awk '{print $1}' > "${file}.md5"
            sha1sum "$file" | awk '{print $1}' > "${file}.sha1"
          done
          (cd central-bundle && zip -q -r -X ../central-bundle.zip com)

          central_auth="$(
            printf '%s:%s' "$CENTRAL_PORTAL_USERNAME" "$CENTRAL_PORTAL_PASSWORD" |
              base64 --wrap=0
          )"
          printf 'silent\nshow-error\nheader = "Authorization: Bearer %s"\n' \
            "$central_auth" > "$auth_config"
          unset central_auth CENTRAL_PORTAL_USERNAME CENTRAL_PORTAL_PASSWORD

          git fetch --no-tags --force origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git rev-parse "${GITHUB_REF}^{tag}")" != "$EXPECTED_TAG_OBJECT" ]] ||
            [[ "$(git rev-parse "${GITHUB_REF}^{commit}")" != "$EXPECTED_TAG_COMMIT" ]] ||
            [[ "$GITHUB_SHA" != "$EXPECTED_TAG_COMMIT" ]]; then
            echo "error: release tag changed after the build completed" >&2
            exit 1
          fi

          upload_code="$(
            curl --config "$auth_config" --request POST \
              --form 'bundle=@central-bundle.zip;type=application/octet-stream' \
              --output "$upload_response" --write-out '%{http_code}' \
              "https://central.sonatype.com/api/v1/publisher/upload?name=alitycs-sdk-jvm-${version}&publishingType=${publishing_type}"
          )"
          if [[ "$upload_code" != "201" ]]; then
            echo "error: Central upload returned HTTP $upload_code" >&2
            sed -n '1,20p' "$upload_response" >&2
            exit 1
          fi
          deployment_id="$(tr -d '\r\n' < "$upload_response")"
          if [[ ! "$deployment_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "error: Central upload did not return a deployment id" >&2
            exit 1
          fi
          echo "Central deployment: $deployment_id" >> "$GITHUB_STEP_SUMMARY"

          deadline=$((SECONDS + 2400))
          while (( SECONDS < deadline )); do
            status_code="$(
              curl --config "$auth_config" --request POST \
                --output "$status_response" --write-out '%{http_code}' \
                "https://central.sonatype.com/api/v1/publisher/status?id=${deployment_id}"
            )"
            if [[ "$status_code" != "200" ]]; then
              echo "error: Central status returned HTTP $status_code" >&2
              sed -n '1,20p' "$status_response" >&2
              exit 1
            fi
            state="$(jq -er '.deploymentState' "$status_response")"
            case "$state" in
              PUBLISHED)
                echo "Maven Central deployment published." >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              VALIDATED)
                if [[ "$publishing_type" == "USER_MANAGED" ]]; then
                  echo "Maven Central deployment validated; publish it in Central Portal." \
                    >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                ;;
              FAILED)
                jq . "$status_response" >&2
                exit 1
                ;;
              PENDING|VALIDATING|PUBLISHING)
                ;;
              *)
                echo "error: unexpected Central deployment state: $state" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "error: timed out waiting for Central deployment validation" >&2
          exit 1
