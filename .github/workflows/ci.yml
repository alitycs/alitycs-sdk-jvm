name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: "3.3.12"
      - name: Verify immutable workflow actions
        run: ./scripts/verify-workflow-pins.rb
      - name: Detect CodeRabbit validation input changes
        id: coderabbit-config
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          validation_paths=(
            ".coderabbit.yaml"
            "scripts/coderabbit-schema.v2.json"
            "scripts/coderabbit-validator-requirements.txt"
            "scripts/validate-coderabbit.sh"
          )
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] &&
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "${validation_paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.coderabbit-config.outputs.changed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - name: Validate CodeRabbit configuration
        if: steps.coderabbit-config.outputs.changed == 'true'
        run: ./scripts/validate-coderabbit.sh
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "11"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test, verify coverage, and build
        run: ./gradlew --no-daemon test koverVerify build publishToMavenLocal
