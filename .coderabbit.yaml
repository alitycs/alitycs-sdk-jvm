# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: >-
  Be concise, specific, and constructive. Prioritize defects that can affect correctness,
  security, compatibility, operability, or maintainability. Avoid stylistic comments already
  enforced by repository tooling and do not repeat the same finding.
early_access: false
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: >-
    Summarize behavioral impact, compatibility risk, security implications, and validation.
  poem: false
  in_progress_fortune: false
  review_status: true
  review_progress: true
  fail_commit_status: true
  changed_files_summary: true
  collapse_walkthrough: false
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false
  auto_apply_labels: false
  auto_assign_reviewers: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  enable_prompt_for_ai_agents: false

  path_instructions:
    - path: "**/*"
      instructions: >-
        Review for correctness, security, backward compatibility, and sufficient focused tests.
        Flag undocumented user-visible behavior and dependency or workflow changes that weaken
        reproducibility, least privilege, or supply-chain safety. GitHub Actions and reusable
        workflows must use full immutable commit SHAs. Docker actions must use immutable SHA-256
        digests; workflow job container and service images must use literal lowercase registry
        references pinned to full SHA-256 digests. Reject YAML merge keys (`<<`) anywhere in
        workflow or action metadata; GitHub Actions does not support them, and they can hide
        references from structural verification. Treat formatting-only preferences as non-blocking
        when automation already enforces them.
    - path: "src/main/kotlin/**/*.kt"
      instructions: >-
        Preserve the Kotlin-first public API, Java interoperability through @JvmStatic,
        @JvmOverloads, and blocking lifecycle wrappers, and JDK 11 compatibility. Review coroutine
        cancellation, shared mutable state, queue bounds, shutdown and flush behavior, and thread
        safety. The SDK sends batches to worker POST /events with a publishable key and must never
        call analytics read APIs or expose Tinybird tokens. Preserve event IDs, session and
        anonymous identity, and the original event timestamp across every retry.
    - path: "src/test/kotlin/**/*.kt"
      instructions: >-
        Require deterministic coverage for behavioral changes. Check wire serialization, retry
        identity and timestamp stability, batching boundaries, queue and lifecycle concurrency,
        error handling, JDK 11 behavior, and both Kotlin and Java-facing APIs. Contract changes
        must also be represented in the shared SDK conformance suite.
    - path: "*.gradle.kts"
      instructions: >-
        Preserve the JDK 11 target, reproducible artifacts, coverage gates, Java interoperability,
        and Maven publication metadata. Reject dynamic or snapshot dependency versions. Every
        dependency or plugin change must update and pass Gradle dependency verification metadata.
    - path: "gradle/**"
      instructions: >-
        Treat the Gradle wrapper, lock state, and dependency-verification changes as supply-chain
        sensitive. Verify checksums and trusted-key scope, keep wrapper components consistent, and
        require a clear reason for every added artifact, including gradle-wrapper.jar.
    - path: ".coderabbit.yaml"
      instructions: >-
        Block changes that disable automatic review, request-changes behavior, exact-head gating,
        or the ignored-bot policy. Require pinned-schema validation for every configuration change
        and keep the scheduled live-schema drift check non-gating. This file is part of the
        exact-blob trust boundary and changes only through the documented two-phase policy and gate
        upgrade procedure.
    - path: ".github/workflows/coderabbit-gate.yml"
      instructions: >-
        This is a protected trust boundary. It must run only from trusted main-branch push,
        pull_request_target, canonical workflow_run, maintainer-command, or manual events without
        checking out or executing pull-request code. Keep the coderabbit-gate environment
        restricted to main. Use a separate Octokit client authenticated by an owner-scoped,
        Contents-read token to verify that the selected Gate App installation contains the current
        repository and only active, public, independent alitycs-sdk-* repositories on main; recheck
        that selection before reading reviews and immediately before a conclusion. Verify the
        policy blob and complete workflow tree against the current main ref, reconcile reviews from
        the API, and avoid repository-global concurrency keys. Rename prior canonical checks to
        unique neutral superseded names, create a fresh exact-head check owned by the dedicated
        Alitycs Gate app, and normalize concurrent duplicates before any conclusion. Initial SDK
        bootstrap follows the documented seed procedure; after that baseline is on main, ordinary
        pull requests must not alter this file.
    - path: ".github/workflows/coderabbit-review-event.yml"
      instructions: >-
        Keep this review-state signal unprivileged: pull_request_review submitted/dismissed only,
        no checkout, secrets, environment, artifacts, outputs, concurrency, or use of pull-request
        data. The trusted gate must treat its workflow_run completion only as a wake-up signal and
        accept that signal only from CodeRabbit or a current write-level collaborator, then re-read
        all pull requests, reviews, workflow identities, and permissions from GitHub.
    - path: ".github/workflows/release.yml"
      instructions: >-
        Do not add an Actions concurrency key. Concurrency groups are repository-global, so a
        pull-request-controlled workflow could reserve the release group's name and block tag
        publication. Preserve immutable release tags, the fresh pre-publication tag-identity
        recheck, and immutable tag and version publication identities as duplicate-release
        defenses.
    - path: ".github/workflows/**"
      instructions: >-
        This entire tree is an exact protected boundary because required Actions checks are bound
        by app and job name, not workflow identity. Initial SDK bootstrap follows the documented
        seed procedure. After that baseline is on main, ordinary pull requests must not change or
        add workflows; use the documented two-phase upgrade procedure. Keep permissions
        least-privileged, GitHub and reusable actions pinned to full commit SHAs, and Docker actions
        pinned to SHA-256 digests. Keep runner labels pinned to explicit OS versions: require
        exactly one scalar explicit versioned GitHub-hosted `runs-on` label for every
        non-reusable job; direct scalar aliases are allowed, while
        reusable-workflow jobs with `uses` may omit it. Reject moving `*-latest` labels,
        expressions, collections, missing or duplicate declarations, and labels outside the
        documented Ubuntu, Windows, and macOS grammar. Workflow container and service images must
        be literal lowercase registry references pinned to full SHA-256 digests. Reject YAML merge
        keys (`<<`) everywhere while continuing to resolve ordinary anchors and aliases
        structurally. CI must stay deterministic, and releases must be gated on the complete
        verification and package-integrity suite.

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"
      - "github-actions[bot]"

  pre_merge_checks:
    override_requested_reviewers_only: true
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: Use a concise, imperative title that describes the behavior changed.
    description:
      mode: warning
    issue_assessment:
      mode: warning

  tools:
    github-checks:
      enabled: true

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    custom: []

  post_merge_actions: []

chat:
  allow_non_org_members: false
  art: false
  auto_reply: true

knowledge_base:
  opt_out: true
  web_search:
    enabled: false
  automatic_repository_linking: false
  linked_repositories: []

issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
    auto_planning:
      enabled: false
      labels: []
  labeling:
    labeling_instructions: []
    auto_apply_labels: false
